<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلامم جیییگرر</title>
    
    <!-- فونت زیبای وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <!-- کتابخانه خواندن گوگل شیت -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <!-- کتابخانه انیمیشن کاغذ رنگی برای جواب درست -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- کتابخانه آیکون‌ها -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #7F00FF; /* بنفش عمیق */
            --secondary: #00C9FF; /* آبی روشن */
            --dark-blue: #1e1366;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.4);
            --correct-color: #00b894;
            --wrong-color: #ff7675;
            --text-main: #2d3436;
        }

        * {
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* پس‌زمینه متحرک آبی و بنفش */
        body {
            background: linear-gradient(-45deg, #7F00FF, #E100FF, #00C9FF, #92FE9D);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* حباب‌های متحرک در پس‌زمینه */
        .circles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; z-index: 0; pointer-events: none;
        }
        .circles li {
            position: absolute; display: block; list-style: none;
            width: 20px; height: 20px;
            background: rgba(255, 255, 255, 0.2);
            animation: animateCircles 25s linear infinite;
            bottom: -150px; border-radius: 50%;
        }
        .circles li:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .circles li:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .circles li:nth-child(3) { left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .circles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .circles li:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
        .circles li:nth-child(6) { left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
        .circles li:nth-child(7) { left: 35%; width: 150px; height: 150px; animation-delay: 7s; }

        @keyframes animateCircles {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 0; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; }
        }

        /* کارت شیشه‌ای اصلی */
        .glass-container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            width: 100%;
            max-width: 700px;
            padding: 40px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 10;
            animation: slideUp 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* تیترها */
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 25px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        /* دکمه‌های درس و فصل */
        .grid-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .btn-glass {
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: var(--dark-blue);
            padding: 15px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.05);
        }

        .btn-glass:hover {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border-color: transparent;
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(127, 0, 255, 0.3);
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            background: rgba(0, 0, 0, 0.05);
            border: none;
            padding: 10px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            color: #555;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover { background: rgba(0, 0, 0, 0.1); }

        /* استایل‌های بخش سوالات */
        .tag-badge {
            display: inline-block;
            background: linear-gradient(45deg, #ff9a9e, #fecfef);
            color: #333;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .question-text {
            font-size: 22px;
            font-weight: 800;
            line-height: 1.8;
            margin-bottom: 25px;
            color: var(--dark-blue);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background: #f8f9fa;
            border: 2px solid #e2e8f0;
            padding: 18px 25px;
            border-radius: 20px;
            text-align: right;
            cursor: pointer;
            font-size: 17px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .option-btn .opt-num {
            background: var(--primary);
            color: white;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            margin-left: 15px;
            font-size: 14px;
        }

        .option-btn:hover {
            border-color: var(--secondary);
            background: #f0f8ff;
            transform: translateX(-5px);
        }

        /* استایل‌های بعد از پاسخ */
        .option-btn.correct {
            background: #e8f8f5;
            border-color: var(--correct-color);
            color: var(--correct-color);
        }
        .option-btn.correct .opt-num { background: var(--correct-color); }

        .option-btn.wrong {
            background: #fdf2f2;
            border-color: var(--wrong-color);
            color: var(--wrong-color);
        }
        .option-btn.wrong .opt-num { background: var(--wrong-color); }

        /* پیام بازخورد */
        .feedback-message {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-top: 25px;
            padding: 15px;
            border-radius: 20px;
            display: none;
            animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .feedback-message.success { color: var(--correct-color); background: rgba(0, 184, 148, 0.1); }
        .feedback-message.error { color: var(--wrong-color); background: rgba(255, 118, 117, 0.1); }

        /* پاسخ تشریحی (ستون J و K) */
        .explanation-box {
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.9);
            border-right: 5px solid var(--secondary);
            padding: 20px;
            border-radius: 15px;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            animation: fadeInDown 0.5s ease;
        }

        .explanation-box h3 {
            color: var(--secondary);
            font-size: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .explanation-box p {
            font-size: 15px;
            line-height: 1.8;
            color: #555;
        }

        /* دکمه بعدی */
        .next-action-btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            width: 100%;
            display: none;
            box-shadow: 0 10px 20px rgba(127, 0, 255, 0.2);
            transition: 0.3s;
        }

        .next-action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(0, 201, 255, 0.3);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        @keyframes fadeInDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .loader-wrapper {
            text-align: center;
            color: var(--dark-blue);
        }
        .loader-icon {
            font-size: 40px;
            animation: spin 2s linear infinite;
            margin-bottom: 15px;
            color: var(--primary);
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <!-- افکت حباب‌های پس‌زمینه -->
    <ul class="circles">
        <li></li><li></li><li></li><li></li><li></li><li></li><li></li>
    </ul>

    <div class="glass-container">
        <div id="loading" class="loader-wrapper">
            <i class="fas fa-spinner loader-icon"></i>
            <h2>بذار سوالاااا داره اماده میشه فرشتهه</h2>
        </div>
        <div id="app" style="display: none;"></div>
    </div>

    <script>
        // 🚨 لینک گوگل شیت که از Publish to web گرفتی رو اینجا بذار 🚨
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTpiWwbBBVdUZWt1DWuToJW9wzGqD33DwHbyAnhu0UoBlWqLf0lNAh7zCvcl6Q4fPmz4NJG9V7tajCm/pub?gid=0&single=true&output=csv';

        let allData = [];
        let selectedSubject = '';
        let selectedChapter = '';
        let currentQuestions = [];
        let currentQuestionIndex = 0;

        function loadData() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: false,
                complete: function(results) {
                    const rows = results.data.slice(1);
                    allData = rows.filter(row => row[0] && row[0].trim() !== '').map(row => ({
                        subject: row[0]?.trim(),
                        chapter: row[1]?.trim(),
                        question: row[2]?.trim(),
                        opt1: row[3]?.trim(),
                        opt2: row[4]?.trim(),
                        opt3: row[5]?.trim(),
                        opt4: row[6]?.trim(),
                        correct: row[7]?.trim(),
                        tag: row[8]?.trim() || '',
                        explanationJ: row[9]?.trim() || '', // ستون J
                        explanationK: row[10]?.trim() || '' // ستون K
                    }));
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('app').style.display = 'block';
                    renderSubjects();
                },
                error: function(err) {
                    document.getElementById('loading').innerHTML = '<h3 style="color:red;">ارور! نتونستم اطلاعات رو بخونم. لینک رو چک کن.</h3>';
                }
            });
        }

        function renderSubjects() {
            const subjects = [...new Set(allData.map(item => item.subject))];
            const app = document.getElementById('app');
            
            let html = `<h1>تست کدوم درسو میخوای بزنی تاج سرم؟؟</h1><div class="grid-buttons">`;
            subjects.forEach(sub => {
                html += `<button class="btn-glass" onclick="selectSubject('${sub}')"><i class="fas fa-book" style="margin-left:8px;"></i> ${sub}</button>`;
            });
            html += `</div>`;
            app.innerHTML = html;
        }

        function selectSubject(sub) {
            selectedSubject = sub;
            const chapters = [...new Set(allData.filter(i => i.subject === sub).map(i => i.chapter))];
            const app = document.getElementById('app');

            let html = `
                <div class="header-controls">
                    <h1>انتخاب فصل</h1>
                    <button class="back-btn" onclick="renderSubjects()"><i class="fas fa-arrow-left"></i> برگشت</button>
                </div>
                <p style="color:#666; font-size:16px; margin-bottom:20px;">درس انتخاب شده: <b>${sub}</b></p>
                <div class="grid-buttons">
            `;
            chapters.forEach(ch => {
                html += `<button class="btn-glass" onclick="startQuiz('${ch}')">فصل ${ch}</button>`;
            });
            html += `</div>`;
            app.innerHTML = html;
        }

        function startQuiz(chapter) {
            selectedChapter = chapter;
            currentQuestions = allData.filter(i => i.subject === selectedSubject && i.chapter === chapter);
            currentQuestionIndex = 0;
            showQuestion();
        }

        function showQuestion() {
            if (currentQuestionIndex >= currentQuestions.length) {
                document.getElementById('app').innerHTML = `
                    <div style="text-align:center;">
                        <h1 style="font-size:35px;">تمومممم افرینننن بچم بهتتت افتخار میکنمااااا مهدی خیلییی دوستت داره </h1>
                        <p style="font-size:18px; margin:20px 0;">تست‌های این فصل تموم شد، خیلی عالی بودی!</p>
                        <button class="next-action-btn" style="display:inline-block;" onclick="renderSubjects()">برگشت به لیست درس‌ها</button>
                    </div>
                `;
                confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
                return;
            }

            const q = currentQuestions[currentQuestionIndex];
            const app = document.getElementById('app');

            let tagHtml = q.tag ? `<div class="tag-badge"><i class="fas fa-tag"></i> ${q.tag}</div>` : '';

            // آماده سازی توضیحات (ترکیب ستون J و K)
            let fullExplanation = '';
            if(q.explanationJ) fullExplanation += q.explanationJ + '<br><br>';
            if(q.explanationK) fullExplanation += q.explanationK;

            let html = `
                <div class="header-controls">
                    <span style="background:var(--primary); color:white; padding:5px 15px; border-radius:20px; font-weight:bold;">سوال ${currentQuestionIndex + 1} از ${currentQuestions.length}</span>
                    <button class="back-btn" onclick="selectSubject('${selectedSubject}')"><i class="fas fa-times"></i> خروج از ازمون</button>
                </div>
                
                ${tagHtml}
                <div class="question-text">${q.question}</div>
                
                <div class="options-container">
                    <button class="option-btn" id="opt-1" onclick="checkAnswer(1, '${q.correct}')">
                        <span class="opt-num">۱</span> <span>${q.opt1}</span>
                    </button>
                    <button class="option-btn" id="opt-2" onclick="checkAnswer(2, '${q.correct}')">
                        <span class="opt-num">۲</span> <span>${q.opt2}</span>
                    </button>
                    <button class="option-btn" id="opt-3" onclick="checkAnswer(3, '${q.correct}')">
                        <span class="opt-num">۳</span> <span>${q.opt3}</span>
                    </button>
                    <button class="option-btn" id="opt-4" onclick="checkAnswer(4, '${q.correct}')">
                        <span class="opt-num">۴</span> <span>${q.opt4}</span>
                    </button>
                </div>

                <div id="feedback" class="feedback-message"></div>
                
                <!-- باکس پاسخ تشریحی (مخفی تا زمان پاسخ) -->
                <div id="explanation" class="explanation-box" data-text="${fullExplanation}"></div>

                <button id="next-btn" class="next-action-btn" onclick="nextQuestion()">سوال بعدی <i class="fas fa-arrow-left" style="margin-right:8px;"></i></button>
            `;
            app.innerHTML = html;
        }

        function checkAnswer(selectedOpt, correctOpt) {
            const feedbackEl = document.getElementById('feedback');
            const explanationEl = document.getElementById('explanation');
            const nextBtn = document.getElementById('next-btn');
            const optionBtns = document.querySelectorAll('.option-btn');

            // قفل کردن همه گزینه‌ها
            optionBtns.forEach(btn => btn.style.pointerEvents = 'none');

            // مشخص کردن جواب درست با رنگ سبز (حتی اگه غلط زده باشه باید بدونه کدوم درست بوده)
            document.getElementById(`opt-${correctOpt}`).classList.add('correct');

            if (selectedOpt.toString() === correctOpt.toString()) {
                // جواب درست بود
                document.getElementById(`opt-${selectedOpt}`).classList.add('correct');
                feedbackEl.className = 'feedback-message success';
                feedbackEl.innerHTML = 'افرینننننننن بچمممم درس خون کی بودی تو هیهیهیهی ';
                
                // شلیک کاغذ رنگی!
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#7F00FF', '#00C9FF', '#ff9a9e']
                });
            } else {
                // جواب غلط بود
                document.getElementById(`opt-${selectedOpt}`).classList.add('wrong');
                feedbackEl.className = 'feedback-message error';
                feedbackEl.innerHTML = 'دقت کن ماه من قربون چشمات برم ';
            }

            feedbackEl.style.display = 'block';
            nextBtn.style.display = 'block';

            // نمایش پاسخ تشریحی (اگر ستون J یا K متنی داشته باشد)
            const explanationText = explanationEl.getAttribute('data-text');
            if (explanationText && explanationText.trim() !== '') {
                explanationEl.innerHTML = `<h3><i class="fas fa-lightbulb"></i> پاسخ تشریحی:</h3><p>${explanationText}</p>`;
                explanationEl.style.display = 'block';
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            showQuestion();
        }

        // استارت
        loadData();
    </script>
</body>
</html>
